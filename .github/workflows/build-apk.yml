name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Temurin JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Environment Verification ==="
          java -version
          echo "JAVA_HOME: $JAVA_HOME"

          JAVA_VER_STRING=$(java -version 2>&1 | head -n 1 | awk -F '"' '{print $2}')
          if [ -z "$JAVA_VER_STRING" ]; then
            echo "::error::Failed to detect Java version string."
            exit 1
          fi
          echo "Detected Java version string: $JAVA_VER_STRING"

          MAJOR_VERSION=$(echo "$JAVA_VER_STRING" | awk -F '.' '{if ($1 == "1") {print $2} else {print $1}}')
          if [ -z "$MAJOR_VERSION" ] || ! [[ "$MAJOR_VERSION" =~ ^[0-9]+$ ]]; then
            echo "::error::Could not parse active Java major version from '$JAVA_VER_STRING'."
            exit 1
          fi
          echo "Detected active Java major version: $MAJOR_VERSION"

          if [ "$MAJOR_VERSION" -lt 17 ]; then
            echo "::error::Active Java version ($MAJOR_VERSION) is lower than the required minimum version (17)."
            exit 1
          fi
          echo "Java version verification passed ($MAJOR_VERSION >= 17)."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          echo "=== Temporary Debug Keystore Check ==="
          if [ -f "./debug.keystore" ]; then
            echo "Existing debug.keystore detected at ./debug.keystore"
          else
            echo "debug.keystore not found. Generating temporary debug keystore..."
            keytool -genkeypair \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

          if [ ! -f "./debug.keystore" ]; then
            echo "::error::./debug.keystore does not exist after generation attempt."
            exit 1
          fi
          echo "Confirmed: ./debug.keystore is present."

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          echo "=== Verifying Debug APK ==="
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "::error::Expected APK not found at $EXPECTED_APK"
            echo "Searching only inside app/build/outputs/apk:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -name "*.apk"
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [ ! -f "$EXPECTED_APK" ]; then
            echo "::error::$EXPECTED_APK is not a regular file."
            exit 1
          fi

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "::error::$EXPECTED_APK is empty."
            exit 1
          fi

          if [[ "$EXPECTED_APK" != *.apk ]]; then
            echo "::error::$EXPECTED_APK does not have .apk extension."
            exit 1
          fi

          if [ "$EXPECTED_APK" != "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "::error::APK path mismatch: expected exact path app/build/outputs/apk/debug/app-debug.apk."
            exit 1
          fi

          echo "APK successfully verified at $EXPECTED_APK"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          echo "=== Preparing APK Release Asset ==="
          TMP_ASSET_DIR=$(mktemp -d -t apk-release-XXXXXX)

          REPO_RAW="${GITHUB_REPOSITORY##*/}"
          REPO_CLEAN=$(echo "$REPO_RAW" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9_-]+/-/g' | sed -E 's/-+/-/g' | sed -E 's/^-|-$//g')
          if [ -z "$REPO_CLEAN" ]; then
            REPO_CLEAN="android-app"
          fi

          ASSET_NAME="${REPO_CLEAN}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          ASSET_PATH="${TMP_ASSET_DIR}/${ASSET_NAME}"

          echo "Copying verified debug APK to $ASSET_PATH"
          cp "app/build/outputs/apk/debug/app-debug.apk" "$ASSET_PATH"

          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "::error::Release asset file is missing or empty at $ASSET_PATH"
            exit 1
          fi

          echo "Release asset prepared successfully: $ASSET_NAME"
          echo "asset_path=$ASSET_PATH" >> "$GITHUB_OUTPUT"
          echo "asset_name=$ASSET_NAME" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_PATH: ${{ steps.prepare_asset.outputs.asset_path }}
          ASSET_NAME: ${{ steps.prepare_asset.outputs.asset_name }}
        run: |
          echo "=== Publishing APK to GitHub Releases ==="
          echo "Verifying GitHub CLI..."
          gh --version || { echo "::error::GitHub CLI (gh) is unavailable."; exit 1; }

          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "::error::Release asset missing or empty: $ASSET_PATH"
            exit 1
          fi

          if [[ "$ASSET_PATH" != *.apk ]]; then
            echo "::error::Release asset does not have .apk extension: $ASSET_PATH"
            exit 1
          fi

          TAG_NAME="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          echo "Release Tag: $TAG_NAME"
          echo "Release Title: $RELEASE_TITLE"
          echo "Target Commit: $GITHUB_SHA"

          NOTES=$(cat <<EOF
          ### Automated Debug Build
          - **Type:** Automatically generated debug APK
          - **Builder:** GitHub Actions
          - **Run Number:** ${GITHUB_RUN_NUMBER}
          - **Run Attempt:** ${GITHUB_RUN_ATTEMPT}
          - **Commit SHA:** ${GITHUB_SHA}
          - **Notice:** This APK is intended for testing and development. It is not a Play Store production release and is signed only with a temporary debug keystore.
          EOF
          )

          gh release create "$TAG_NAME" "$ASSET_PATH" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE" \
            --notes "$NOTES" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_OUTCOME: ${{ steps.publish_release.outcome }}
          ASSET_NAME: ${{ steps.prepare_asset.outputs.asset_name }}
        run: |
          TAG_NAME="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          if [ "$RELEASE_OUTCOME" = "success" ]; then
            echo "=== Release Publication Succeeded ==="
            gh release view "$TAG_NAME" || true
            RELEASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG_NAME}"

            echo "Release Tag: $TAG_NAME"
            echo "Release Title: $RELEASE_TITLE"
            echo "Direct GitHub Release Page URL: $RELEASE_URL"
            echo "APK Asset Filename: $ASSET_NAME"

            cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## 🚀 Debug APK Build & Release Succeeded

          - **Release Tag:** \`${TAG_NAME}\`
          - **Release Title:** ${RELEASE_TITLE}
          - **APK Asset Filename:** \`${ASSET_NAME}\`
          - **Release Page URL:** [${RELEASE_URL}](${RELEASE_URL})

          ### Download Information
          - The APK can be downloaded directly under the **Assets** section of the [Release Page](${RELEASE_URL}).
          - **Backup:** The standard GitHub Actions artifact named \`app-debug-apk\` is also preserved and available on this workflow run.
          EOF
          else
            echo "::warning::GitHub Release publishing did not complete successfully (outcome: $RELEASE_OUTCOME)."
            echo "The APK build succeeded. The GitHub Actions artifact named 'app-debug-apk' remains available."

            cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## ⚠️ GitHub Release Notice

          - **Release Publication:** Did not complete (outcome: \`${RELEASE_OUTCOME}\`).
          - **APK Build Status:** Succeeded.
          - **Artifact Backup:** The workflow artifact named \`app-debug-apk\` is available under the Artifacts section of this workflow run.
          EOF
          fi
